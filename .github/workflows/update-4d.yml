name: อัปเดตผล Magnum 4D

on:
  schedule:
    - cron: "30 19 * * *"   # 02:30 น. เวลาไทย
    - cron: "30 1 * * *"    # 08:30 น. เวลาไทย (รอบสำรอง)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_4d.py
      - name: Commit if changed
        run: |
          if git diff --quiet data4d.js; then echo "ไม่มีงวดใหม่"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data4d.js
          git commit -m "อัปเดตผล Magnum 4D อัตโนมัติ"
          git push
