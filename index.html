<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thai Lottery Analytics</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0A1630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="วิเคราะห์หวย">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1630;--s1:#12234A;--s2:#182D5A;--line:#263F70;--gold:#E0B654;--text:#FFFFFF;--muted:#A9B6CC;--soft:#D5DCE8;--cold:#8EC1FF}
*{box-sizing:border-box}
html,body{margin:0;background:#050D1F;color:var(--text);font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:var(--gold);text-decoration:none}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:96px;position:relative}
.num{font-family:'Chakra Petch',sans-serif;font-weight:700;letter-spacing:2px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Chakra Petch';font-weight:700;font-size:14px;flex:none}
.pill{font-size:11px;font-weight:600;color:var(--bg);background:var(--muted);border-radius:999px;padding:4px 10px;white-space:nowrap}
h1{margin:0;font-size:21px}
h2{margin:0;font-size:16px}
.sub{font-size:12px;color:var(--muted)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px}
.px{margin-left:20px;margin-right:20px}
.mt{margin-top:16px}
.seg{background:var(--s1);border-radius:14px;padding:4px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{min-height:44px;border:0;border-radius:10px;font-size:15px;font-weight:600;background:transparent;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;background:transparent;color:var(--soft);border:1px solid var(--line)}
.chips button.on{background:#fff;color:var(--bg);border-color:#fff}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{min-height:44px;padding:0;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap}
.tabs button.on{border-bottom-color:var(--gold);color:#fff}
.row{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:#fff;width:100%;text-align:left;font:inherit;min-height:56px}
.bar{height:6px;background:var(--bg);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:999px}
.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.note{background:var(--s2);border-radius:14px;padding:14px;font-size:13px;line-height:1.6;color:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.b-has{background:var(--gold);color:var(--bg)}.b-build{background:var(--cold);color:var(--bg)}.b-new{border:1px solid var(--line);color:var(--soft)}
.heat{display:grid;gap:3px}
.heat span{border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'Chakra Petch';font-size:11px;font-weight:600;height:28px}
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:grid;grid-template-columns:repeat(5,1fr);background:#0D1C3D;border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav.bottom button{background:transparent;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:48px}
nav.bottom button.on{color:var(--gold);font-weight:600}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:#fff;border-radius:12px}
dl{margin:0}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--muted);font-weight:500;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid #1C3260}
.slider{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.slider:last-child{border-bottom:0}
input[type=range]{width:100%;accent-color:var(--gold);height:28px}
.btn{min-height:46px;border-radius:12px;border:0;background:var(--gold);color:var(--bg);font-weight:700;font-size:15px;width:100%}
.btn.ghost{background:transparent;border:1px dashed var(--gold);color:var(--gold)}
.ok{color:#7FE0A8}.warn{color:#FFB46B}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="bottom" id="nav" aria-label="เมนูหลัก"></nav>

<script src="data.js"></script>
<script src="data4d.js"></script>
<script>
// ผลรางวัลย้อนหลัง: ข้อมูลจริงจาก github.com/vicha-w/thai-lotto-archive (ตรวจเทียบกับข่าวผลสลาก)
// ข้อมูลทั้งหมดอยู่ใน data.js (ระบบเก็บอัตโนมัติอัปเดตไฟล์นั้น) · หน้า Admin ยังเป็นตัวอย่าง
const DATA = window.TLA_DATA;
const DRAWS = DATA.draws;
const NEXT_DRAW_ISO = DATA.nextDraw;
const NEXT_ISO = NEXT_DRAW_ISO;
const S = { game:'th', page:'home', digits:'2', group:'stat',showTies:false,openHist:'',btReady:false,period:'10y', list:'hot', popView:'nums', status:'all', mode:'exact', pick:null,
  w:{y10:15,y15:20,pattern:15,relation:10,source:20,trend:20} };

const POOLS = {
  '2': [['47',82,74],['19',76,88],['63',88,52],['05',64,91],['28',79,60],['91',71,69],['36',58,84],['70',85,40],['12',62,72],['84',55,78],['59',69,57],['23',50,80],['40',74,45]],
  '3': [['258',84,77],['731',79,85],['406',90,48],['512',66,90],['889',73,62],['164',81,55],['027',60,82],['395',70,66],['648',57,79],['913',76,50],['570',63,64],['382',52,74]]
};
const ICON = {
  home:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  stat:'<line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="9"/>',
  pop:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14c2.4.3 4 2.2 4 5"/>',
  perf:'<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>',
  admin:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  back:'<polyline points="15 18 9 12 15 6"/>',
  info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
};
const svg = (k,s=22,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

function set(p){ Object.assign(S,p); render(); if(p.page) window.scrollTo(0,0); }
function seg(key, opts){ return `<div class="seg">${opts.map(([v,l])=>`<button class="${S[key]===v?'on':''}" onclick="set({${key}:'${v}'})">${l}</button>`).join('')}</div>`; }
function chips(key, opts){ return `<div class="chips">${opts.map(([v,l])=>`<button class="${S[key]===v?'on':''}" onclick="set({${key}:'${v}'})">${l}</button>`).join('')}</div>`; }
function tabs(key, opts){ return `<div class="tabs">${opts.map(([v,l])=>`<button class="${S[key]===v?'on':''}" onclick="set({${key}:'${v}'})">${l}</button>`).join('')}</div>`; }
const DIG = [['2','เลข 2 ตัว'],['3','เลข 3 ตัว']];
const PER = [['1y','1 ปี'],['5y','5 ปี'],['10y','10 ปี'],['all','ทั้งหมด']];
const PERNAME = {'1y':'ย้อนหลัง 1 ปี','5y':'ย้อนหลัง 5 ปี','10y':'ย้อนหลัง 10 ปี','all':'ข้อมูลทั้งหมด'};

function weights(){ const w=S.w; const stat=w.y10+w.y15+w.pattern+w.relation; const pop=w.source+w.trend; return {stat,pop,total:stat+pop}; }
function scored(){
  const {stat,pop,total}=weights();
  return POOLS[S.digits].map(([n,st,po])=>({n,st,po,co:Math.round(((st*stat+po*pop)/total)*10)/10}));
}

function topHeader(title, subtitle){
  return `<header class="top"><div style="display:flex;align-items:center;gap:10px"><div class="logo">TLA</div><div><div style="font-size:16px;font-weight:700">${title}</div><div class="sub">${subtitle}</div></div></div><span class="pill">ข้อมูลตัวอย่าง</span></header>`;
}

// ===== ข้อมูลจริง: ผลรางวัลย้อนหลัง (DRAWS = [วันที่, รางวัลที่ 1, เลขท้าย 2 ตัว]) =====
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(s){ const [y,m,d]=s.split('-').map(Number); return d+' '+TH_M[m-1]+' '+(y+543); }
const ALL = DRAWS.map(([date,first,two])=>({date,first,two,three:first.slice(-3)}));
const BYDATE = Object.fromEntries(ALL.map(r=>[r.date,r]));
const LATEST = ALL[ALL.length-1];
const NEXT_DRAW = (()=>{const [y,m,d]=NEXT_DRAW_ISO.split('-').map(Number);return d+' '+['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'][m-1]+' '+(y+543);})();
function keyOf(d){ return (d||S.digits)==='2'?'two':'three'; }
const UNI={};
function universe(d){ d=d||S.digits; if(UNI[d]) return UNI[d]; const n=d==='2'?100:1000, w=d==='2'?2:3; return UNI[d]=Array.from({length:n},(_,i)=>String(i).padStart(w,'0')); }
const PERM={};
function permSet(n){ if(PERM[n]) return PERM[n]; const out=new Set(); const go=(pre,rest)=>{ if(!rest.length){out.add(pre);return;} for(let i=0;i<rest.length;i++) go(pre+rest[i],rest.slice(0,i)+rest.slice(i+1)); }; go('',n); return PERM[n]=out; }
function periodDraws(per){
  per=per||S.period;
  if(per==='all') return ALL;
  const yrs={'1y':1,'5y':5,'10y':10}[per];
  const [y,m,d]=LATEST.date.split('-').map(Number);
  const cut=String(y-yrs)+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  return ALL.filter(r=>r.date>cut);
}
const pct=v=>(Math.round(v*1000)/10).toFixed(1)+'%';

// ===== สูตรคะแนนสถิติ 4 ปัจจัย (แยกเลข 2 ตัว / 3 ตัว) =====
// 1) สถิติระยะยาว: ความถี่ใน 240 งวดล่าสุด (≈10 ปี)  2) สถิติระยะกลาง: ความถี่ใน 120 งวดล่าสุด (≈5 ปี)
// 3) รูปแบบตัวเลข: กลุ่มลักษณะของเลข (มีเลขซ้ำ / ผลรวมหลัก / คู่-คี่ / สูง-ต่ำ) ออกบ่อยกว่าที่ควรเป็นแค่ไหน
// 4) ความสัมพันธ์ระหว่างรางวัล: เลขที่มีตัวเลขซ้ำกับงวดล่าสุด × อัตราที่ตัวเลขเคยซ้ำงวดก่อนจริงเทียบกับค่าที่ควรเป็น
// ทุกปัจจัยปรับเป็น 0–100 แล้วรวมตามน้ำหนักที่ Admin ตั้ง
const FEATS=[n=>new Set(n).size<n.length?'r':'u', n=>[...n].reduce((a,d)=>a+(+d),0)%10, n=>[...n].map(d=>d%2).join(''), n=>[...n].map(d=>+d>=5?1:0).join('')];
const SHARE={};
function shareFrac(prev,d){ const key=d+[...new Set(prev)].sort().join(''); if(SHARE[key]!==undefined) return SHARE[key]; const ps=new Set(prev); const U=universe(d); return SHARE[key]=U.filter(u=>[...u].some(c=>ps.has(c))).length/U.length; }
function minmax(o,U){ const v=U.map(n=>o[n]); const mn=Math.min(...v), mx=Math.max(...v); const r={}; U.forEach(n=>r[n]=mx===mn?50:(o[n]-mn)/(mx-mn)*100); return r; }
function statScores(seq,d){
  const U=universe(d), w=S.w;
  const freq=(win)=>{ const c={}; U.forEach(n=>c[n]=0); seq.slice(-win).forEach(v=>c[v]++); const m=Math.max(...U.map(n=>c[n]))||1; const o={}; U.forEach(n=>o[n]=c[n]/m*100); return {o,c}; };
  const L=freq(240), M=freq(120);
  const win=seq.slice(-240);
  const pr={}; U.forEach(n=>pr[n]=0);
  FEATS.forEach(f=>{ const size={},obs={}; U.forEach(n=>{const k=f(n);size[k]=(size[k]||0)+1;}); win.forEach(v=>{const k=f(v);obs[k]=(obs[k]||0)+1;});
    U.forEach(n=>{const k=f(n); pr[n]+=(((obs[k]||0)/win.length)/(size[k]/U.length))/FEATS.length;}); });
  const pat=minmax(pr,U);
  let ob=0, ex=0;
  for(let i=1;i<win.length;i++){ const ps=new Set(win[i-1]); if([...win[i]].some(c=>ps.has(c))) ob++; ex+=shareFrac(win[i-1],d); }
  const lift = ex? ob/ex : 1;
  const prev=seq[seq.length-1]; const ps=new Set(prev);
  const prevKey=[...prev].sort().join('');
  // เลขที่เหมือนงวดล่าสุดทั้งชุด (ตัวเดิมหรือสลับตำแหน่ง) ไม่ได้คะแนนปัจจัยนี้ ให้เฉพาะเลขที่มีตัวเลขร่วมบางตัว
  const rr={}; U.forEach(n=>rr[n]=([...n].sort().join('')===prevKey)?0:new Set([...n].filter(c=>ps.has(c))).size*lift);
  const rmax=Math.max(...U.map(n=>rr[n]))||1; const rel={}; U.forEach(n=>rel[n]=rr[n]/rmax*100);
  const tw=w.y10+w.y15+w.pattern+w.relation||1;
  const out={};
  U.forEach(n=>{ out[n]={ n, score: Math.round((w.y10*L.o[n]+w.y15*M.o[n]+w.pattern*pat[n]+w.relation*rel[n])/tw*10)/10,
    long:L.o[n], mid:M.o[n], pat:pat[n], rel:rel[n], cLong:L.c[n], cMid:M.c[n] }; });
  return {rows:out, lift, prev};
}
const CACHE={};
function stats(){
  const ck=S.digits+S.period+JSON.stringify(S.w); if(CACHE[ck]) return CACHE[ck];
  const k=keyOf(), P=periodDraws(), U=universe();
  const cnt={}, lastIdx={};
  U.forEach(n=>{cnt[n]=0;});
  P.forEach(r=>{cnt[r[k]]++;});
  ALL.forEach((r,i)=>{lastIdx[r[k]]=i;});
  const max=Math.max(...U.map(n=>cnt[n]));
  // เลข 3 ตัวมี 1,000 แบบ ข้อมูล 1 ปี (24 งวด) น้อยเกินไป คะแนนจึงใช้อย่างน้อย 5 ปีเสมอ
  const scoreMin5 = S.digits==='3' && S.period==='1y';
  const SP = scoreMin5 ? periodDraws('5y') : P;
  const sc=statScores(SP.map(r=>r[k]), S.digits);
  const rows=U.map(n=>{
    const li=lastIdx[n]; let permCnt=0; const ps=permSet(n); P.forEach(r=>{ if(ps.has(r[k])) permCnt++; });
    return { n, count:cnt[n], rate:cnt[n]/P.length, permCnt, score: sc.rows[n].score, f: sc.rows[n],
      last: li===undefined?null:ALL[li].date, gap: li===undefined?null:(ALL.length-1-li) };
  });
  return CACHE[ck]={rows,P,max,lift:sc.lift,scoreMin5,SPn:SP.length};
}
function emptyState(title,msg){ return `<div class="card px" style="margin-top:12px;text-align:center;padding:22px 16px"><div style="font-weight:700;margin-bottom:6px">${title}</div><div class="sub" style="line-height:1.6">${msg}</div></div>`; }
const REAL_PILL='<span class="pill" style="background:#7FE0A8">ข้อมูลจริง</span>';

// ===== ข้อมูลสำนัก (เก็บจากข่าวที่เผยแพร่ก่อนวันออกรางวัล) — อยู่ใน data.js: tips[ชื่อสำนัก][วันที่]["2"|"3"] =====
const TIPS = DATA.tips || {};
const SRC_NAMES = Object.keys(TIPS);
function sourceRecord(name,d){
  d=d||'2'; const k=d==='2'?'two':'three'; const T=TIPS[name]||{};
  const rows=Object.keys(T).sort().filter(dt=>BYDATE[dt] && !T[dt].entry && T[dt][d] && T[dt][d].length).map(dt=>{ const r=BYDATE[dt][k], t=T[dt][d]; const ex=t.includes(r); const pm=ex||t.some(x=>permSet(x).has(r)); return {date:dt,result:r,tips:t,ex,pm}; });
  const n=rows.length;
  return {name,rows,n,ex:rows.filter(r=>r.ex).length,pm:rows.filter(r=>r.pm).length,status:n>=24?'มีประวัติ':(n>0?'สะสมประวัติ':'สำนักใหม่')};
}
function nextTips(d){ d=d||S.digits; const out=[]; SRC_NAMES.forEach(nm=>{ const t=(TIPS[nm][NEXT_ISO]||{})[d]; if(t&&t.length) out.push({name:nm,tips:[...new Set(t)]}); }); return out; }
// คะแนนสำนัก = สัดส่วนสำนักที่ให้เลขนั้น (สำนักเดียวกันให้ซ้ำไม่นับเพิ่ม) ปรับเป็น 0–100
function popularScores(){ const nt=nextTips(); if(!nt.length) return null; const c={}; nt.forEach(s=>s.tips.forEach(n=>{c[n]=(c[n]||0)+1;})); return {n:nt.length, rows:Object.keys(c).map(n=>({n,count:c[n],score:Math.round(c[n]/nt.length*1000)/10, by:nt.filter(s=>s.tips.includes(n)).map(s=>s.name)}))}; }
// ===== เหตุการณ์และกระแส (จากข่าวที่รายงานกระแส Facebook / TikTok) — data.js: trends[วันที่งวด] = [{title,from,date,url,"2":[],"3":[]}] =====
const TRENDS = DATA.trends || {};
function trendEvents(iso,d){ d=d||S.digits; return (TRENDS[iso]||[]).map(e=>({...e,nums:[...new Set(e[d]||[])]})).filter(e=>e.nums.length); }
// คะแนนกระแส = สัดส่วนเรื่องกระแสที่พูดถึงเลขนั้น ปรับเป็น 0–100
function trendScores(d){ const ev=trendEvents(NEXT_ISO,d); if(!ev.length) return null; const c={}; ev.forEach(e=>e.nums.forEach(n=>{c[n]=(c[n]||0)+1;})); return {n:ev.length, rows:Object.keys(c).map(n=>({n,count:c[n],score:Math.round(c[n]/ev.length*1000)/10}))}; }
// รวมคะแนน: สถิติ + สำนัก + กระแส (ใช้เฉพาะส่วนที่มีข้อมูล)
function combineRows(st,ps,ts){
  const w=S.w, ws=w.y10+w.y15+w.pattern+w.relation, wp=ps?w.source:0, wt=ts?w.trend:0, tot=ws+wp+wt;
  const sm=Object.fromEntries(st.rows.map(r=>[r.n,r.score])), pm=ps?Object.fromEntries(ps.rows.map(r=>[r.n,r])):{}, tm=ts?Object.fromEntries(ts.rows.map(r=>[r.n,r.score])):{};
  const all=new Set([...Object.keys(sm),...Object.keys(pm),...Object.keys(tm)]);
  return [...all].map(n=>{ const p=pm[n], s=sm[n]||0, t=tm[n]||0, sc=p?p.score:0;
    return {n,count:p?p.count:0,score:sc,by:p?p.by:[],st:s,tr:t,co:Math.round((s*ws+sc*wp+t*wt)/tot*10)/10}; });
}
const BADGE={'มีประวัติ':'b-has','สะสมประวัติ':'b-build','สำนักใหม่':'b-new'};

function topFor(d){
  const sv=S.digits; S.digits=d;
  const st=stats(), ps=popularScores(), ts=trendScores(); let rows, src;
  if(ps||ts){ rows=combineRows(st,ps,ts).map(r=>({n:r.n,v:r.co})); src='รวมสถิติ'+(ps?' + สำนัก':'')+(ts?' + กระแส':''); }
  else { rows=st.rows.map(r=>({n:r.n,v:r.score})); src='จากสถิติ (เลขสำนักยังไม่ออก)'; }
  rows.sort((a,b)=>b.v-a.v||(a.n<b.n?-1:1)); S.digits=sv; return {top:rows.slice(0,3),src};
}

// ===== ทดสอบย้อนหลังแบบ walk-forward: ทุกงวดใช้เฉพาะข้อมูลก่อนหน้า แล้วเลือก Top 10 ตามคะแนนสถิติ 4 ปัจจัย =====
const BT={};
function backtest(){
  const ck=S.digits+JSON.stringify(S.w); if(BT[ck]) return BT[ck];
  const k=keyOf(); const seq=ALL.map(r=>r[k]); const TEST=240; const res=[];
  for(let i=seq.length-TEST;i<seq.length;i++){
    const sc=statScores(seq.slice(0,i),S.digits).rows;
    const top=Object.values(sc).sort((a,b)=>b.score-a.score||b.cMid-a.cMid||(a.n<b.n?-1:1)).slice(0,10).map(x=>x.n);
    const r=seq[i];
    res.push({date:ALL[i].date,result:r,top,exact:top.includes(r),perm:top.some(t=>permSet(t).has(r))});
  }
  return BT[ck]={res,TEST};
}

function myNextDraw(){ const d=new Date(MY_LATEST.date+'T12:00:00'); do{ d.setDate(d.getDate()+1);}while(![0,3,6].includes(d.getDay())); return d.toISOString().slice(0,10); }
const TH_ML=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function thDateLong(s){ const [y,m,d]=s.split('-').map(Number); return d+' '+TH_ML[m-1]+' '+(y+543); }
const DAYS=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function dayName(s){ return DAYS[new Date(s+'T12:00:00').getDay()]; }
function myPeriod(){
  if(S.period==='all') return MY_ALL;
  const yrs={'1y':1,'5y':5,'10y':10}[S.period]; const [y,m,d]=MY_LATEST.date.split('-').map(Number);
  const cut=String(y-yrs)+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  return MY_ALL.filter(r=>r.date>cut);
}
// ค่าที่คำนวณล่วงหน้าเพื่อให้เร็ว: กลุ่มรูปแบบของแต่ละเลข และชุดตัวเลข (bitmask) ของแต่ละเลข
const MY_MASK=new Int32Array(10000), MY_FK=FEATS.map(()=>new Array(10000)), MY_FSIZE=FEATS.map(()=>({}));
MY_U.forEach((n,i)=>{ let m=0; for(const c of n) m|=1<<(+c); MY_MASK[i]=m; FEATS.forEach((f,j)=>{ const k=f(n); MY_FK[j][i]=k; MY_FSIZE[j][k]=(MY_FSIZE[j][k]||0)+1; }); });
const popc=x=>{ let c=0; while(x){ x&=x-1; c++; } return c; };
const MY_SHARE={};
function myShareFrac(pm){ if(MY_SHARE[pm]!==undefined) return MY_SHARE[pm]; let c=0; for(let i=0;i<10000;i++) if(MY_MASK[i]&pm) c++; return MY_SHARE[pm]=c/10000; }
// สูตร 4 ปัจจัยแบบเดียวกับหวยไทย ปรับให้เลข 4 หลักและ 3 รางวัลต่องวด
function myScores(draws){
  const w=S.w;
  const freq=(win)=>{ const c=new Int32Array(10000); const s=Math.max(0,draws.length-win); for(let i=s;i<draws.length;i++){ const r=draws[i].nums; c[+r[0]]++; c[+r[1]]++; c[+r[2]]++; } let m=0; for(let i=0;i<10000;i++) if(c[i]>m) m=c[i]; return {c,m:m||1}; };
  const L=freq(MY_WIN_LONG), M=freq(MY_WIN_MID);
  const win=draws.slice(-MY_WIN_LONG); let total=0;
  const pr=new Float64Array(10000);
  FEATS.forEach((f,j)=>{ const obs={}; for(let i=0;i<10000;i++){ if(L.c[i]){ const k=MY_FK[j][i]; obs[k]=(obs[k]||0)+L.c[i]; } }
    total = win.length*3;
    for(let i=0;i<10000;i++){ const k=MY_FK[j][i]; pr[i]+=(((obs[k]||0)/total)/(MY_FSIZE[j][k]/10000))/FEATS.length; } });
  let pmn=Infinity,pmx=-Infinity; for(let i=0;i<10000;i++){ if(pr[i]<pmn) pmn=pr[i]; if(pr[i]>pmx) pmx=pr[i]; }
  const prevN=draws[draws.length-1].nums[0], pm=MY_MASK[+prevN], prevKey=[...prevN].sort().join('');
  const tw=w.y10+w.y15+w.pattern+w.relation||1;
  const sc=new Float64Array(10000);
  for(let i=0;i<10000;i++){
    const rel=([...MY_U[i]].sort().join('')===prevKey)?0:popc(MY_MASK[i]&pm)/4*100;
    const pat=pmx===pmn?50:(pr[i]-pmn)/(pmx-pmn)*100;
    sc[i]=Math.round((w.y10*L.c[i]/L.m*100 + w.y15*M.c[i]/M.m*100 + w.pattern*pat + w.relation*rel)/tw*10)/10; }
  return {sc, cLong:L.c, cMid:M.c};
}
function myTop(sc,k){ const top=[]; for(let i=0;i<10000;i++){ const v=sc[i]; if(top.length<k || v>sc[top[top.length-1]]){ let j=top.length; top.push(i); while(j>0 && (sc[top[j-1]]<v)){ top[j]=top[j-1]; j--; } top[j]=i; if(top.length>k) top.pop(); } } return top.map(i=>MY_U[i]); }

function myStats(){
  const ck=S.period+JSON.stringify(S.w); if(MY_CACHE[ck]) return MY_CACHE[ck];

  P.forEach(r=>r.nums.forEach((n,j)=>{cnt[+n]++; byPrize[j][+n]++;}));
  const lastIdx=new Int32Array(10000).fill(-1); MY_ALL.forEach((r,i)=>r.nums.forEach(n=>{lastIdx[+n]=i;}));
  const s=myScores(P.length>=10?P:MY_ALL);

}

const MY_BT={};
function myBacktest(){
  const ck=JSON.stringify(S.w); if(MY_BT[ck]) return MY_BT[ck];
  const TEST=165, res=[];
  for(let i=MY_ALL.length-TEST;i<MY_ALL.length;i++){
    const s=myScores(MY_ALL.slice(Math.max(0,i-MY_WIN_LONG),i)); const top=myTop(s.sc,10);
    const r=MY_ALL[i].nums; const ex=r.filter(n=>top.includes(n)); const pm=r.filter(n=>top.some(t=>permSet(t).has(n)));
    res.push({date:MY_ALL[i].date,result:r,top,exact:ex.length>0,perm:pm.length>0,exN:ex,pmN:pm});
  }
  return MY_BT[ck]={res};
}

  const y=window.scrollY;
  const my=S.game==='my';
  const pg = my ? (MY_PAGES[S.page]||pageMyHome) : PAGES[S.page];
  document.getElementById('app').innerHTML = (S.page==='admin'?'':gameBar()) + pg();
  const cur = S.page==='detail'?'home':S.page;
  const nav = my ? NAV.filter(x=>x[0]!=='pop') : NAV;
  const el=document.getElementById('nav'); el.style.gridTemplateColumns='repeat('+nav.length+',1fr)';
  el.innerHTML = nav.map(([p,l,i])=>`<button class="${cur===p?'on':''}" onclick="set({page:'${p}'})">${svg(i)}${l}</button>`).join('');
  window.scrollTo(0,y);
}
render();
</script>
</body>
</html>
